- name: Enable collectd_nlbwmon_vnstat-backup on boot + restore data from backup
  community.general.openwrt_init:
    name: collectd_nlbwmon_vnstat-backup
    # "reloaded" is a workaround to force the service to restore the data from the backup
    state: reloaded
    enabled: true

- name: Restart banip
  community.general.openwrt_init:
    name: banip
    state: restarted

- name: Restart cloudflared
  community.general.openwrt_init:
    name: cloudflared
    state: restarted

- name: Restart dropbear
  community.general.openwrt_init:
    name: dropbear
    state: restarted

- name: Reload firewall
  community.general.openwrt_init:
    name: firewall
    state: reloaded

- name: Restart hd-idle
  community.general.openwrt_init:
    name: hd-idle
    state: restarted
