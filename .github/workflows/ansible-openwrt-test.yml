---
# GitHub Actions workflow for testing Ansible playbooks against OpenWrt
# containers. Each job spins up an OpenWrt x86-64 rootfs Docker container
# with SSH access and runs the playbook against it.
name: ansible-openwrt-test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ansible/**

permissions: read-all

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  gate-xvx-cz:
    name: "gate.xvx.cz (ASUS RT-AX53U)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine latest stable OpenWrt version
        run: |
          # Pick the newest stable rootfs tag that exists (sysupgrade API can
          # be ahead of images); skopeo and jq are preinstalled on the runner.
          VERSION=$(skopeo list-tags docker://docker.io/openwrt/rootfs | jq -r '.Tags[] | select(test("^x86_64-[0-9]+\\.[0-9]+\\.[0-9]+$")) | sub("^x86_64-"; "")' | sort -V | tail -n1) || true
          if [ -z "${VERSION}" ]; then
            echo "::error::No stable OpenWrt rootfs image found in docker.io/openwrt/rootfs" >&2
            exit 1
          fi
          echo "Latest stable OpenWrt version: ${VERSION}"
          echo "OPENWRT_VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Start OpenWrt container with SSH
        run: |
          docker run -d --name openwrt \
            --hostname gate \
            -p 2222:22 \
            --entrypoint /bin/sh \
            "docker.io/openwrt/rootfs:x86_64-${OPENWRT_VERSION}" \
            -c "sleep infinity"

          # Wait for container to be ready
          sleep 2

          # Install dropbear (SSH) and Python inside the container
          docker exec openwrt sh -c '
            mkdir -p /var/lock /var/run
            apk update
            apk add dropbear python3-light python3-decimal python3-idna python3-logging
            dropbear -R -p 22
          '

          # Configure SSH key-based authentication
          ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N "" -q
          docker exec openwrt sh -c "mkdir -p /etc/dropbear"
          docker cp ~/.ssh/id_ed25519.pub openwrt:/tmp/authorized_key
          docker exec openwrt sh -c '
            cat /tmp/authorized_key >> /etc/dropbear/authorized_keys
            chmod 600 /etc/dropbear/authorized_keys
          '

          # Verify SSH connectivity
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -p 2222 root@127.0.0.1 "echo 'SSH connection successful'"

          # Generate a valid test-only Dropbear ed25519 host key for the playbook
          docker exec openwrt dropbearkey -t ed25519 -f /tmp/ci_ed25519_host_key
          set +x
          DROPBEAR_KEY=$(docker exec openwrt cat /tmp/ci_ed25519_host_key | base64 -w0)
          echo "::add-mask::${DROPBEAR_KEY}"
          echo "GATE_XVX_CZ_DROPBEAR_ED25519_HOST_KEY=${DROPBEAR_KEY}" >> "${GITHUB_ENV}"
          set -x

      - name: Install Ansible and dependencies
        run: |
          pip3 install ansible passlib
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Create test inventory
        run: |
          cat > ansible/inventory/test-hosts <<'EOF'
          [openwrt]
          gate.xvx.cz ansible_host=127.0.0.1 ansible_port=2222

          [openwrt:vars]
          ansible_user=root
          ansible_remote_tmp=/tmp/ansible
          ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
          EOF

      - name: Run Ansible playbook
        env:
          GATE_XVX_CZ_CLOUDFLARED_TUNNEL_TOKEN: ci-test-dummy-value
          GATE_XVX_CZ_LUCI_HOMEPAGE_OPENWRT_WIDGET_PASSWORD_HASH: ci-test-dummy-value
          GATE_XVX_CZ_MSMP_AUTH_PASSWORD: ci-test-dummy-value
          GATE_XVX_CZ_ROOT_PASSWORD: ci-test-dummy-value
          GATE_XVX_CZ_WIFI_PASSWORD: ci-test-dummy-value
        working-directory: ansible
        run: |
          ansible-playbook --diff main.yml \
            -i inventory/test-hosts \
            --limit gate.xvx.cz

      # The container has no procd, so the "Restart dropbear" handler is a no-op there.
      # Restart Dropbear manually with the deployed key to prove it is valid and served alone.
      - name: Verify Dropbear serves only the managed host key
        run: |
          docker exec openwrt sh -c '
            set -eu
            grep -q "list keyfile '\''/etc/dropbear/dropbear_ed25519_host_key'\''" /etc/config/dropbear
            ls -l /etc/dropbear/dropbear_ed25519_host_key | grep -q "^-rw------- "
            cmp /tmp/ci_ed25519_host_key /etc/dropbear/dropbear_ed25519_host_key
            killall dropbear
            sleep 1
            dropbear -p 22 -r /etc/dropbear/dropbear_ed25519_host_key
          '
          sleep 2
          # ssh-keyscan completes a key exchange signed by the host key; an SSH login is not
          # possible here because the play replaces authorized_keys with the real user keys
          EXPECTED=$(docker exec openwrt dropbearkey -y -f /tmp/ci_ed25519_host_key | awk '/^ssh-/ { print $1, $2 }')
          OFFERED=$(ssh-keyscan -p 2222 127.0.0.1 2> /dev/null | awk '!/^#/ { print $2, $3 }')
          if [[ "${OFFERED}" != "${EXPECTED}" ]]; then
            echo "::error::Dropbear host keys differ from the managed key: ${OFFERED}" >&2
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: docker rm -f openwrt || true
